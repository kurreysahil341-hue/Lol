name: Android Native CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Native Android App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Prepare Signing Credentials
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # First, restore debug.keystore from base64 if it exists, or generate a fallback
        if [ -f debug.keystore.base64 ]; then
          echo "Decoding debug.keystore from base64..."
          base64 --decode debug.keystore.base64 > debug.keystore
          mkdir -p android
          cp debug.keystore android/
        else
          echo "debug.keystore.base64 not found, generating temporary debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          mkdir -p android
          cp debug.keystore android/
        fi

        if [ ! -z "$KEYSTORE_BASE64" ]; then
          echo "Decoding production keystore..."
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          echo "Writing key.properties..."
          echo "storeFile=release.jks" > key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties
          
          # Copy to android/ subfolder in case the build triggers there
          mkdir -p android
          cp release.jks android/
          cp key.properties android/
        else
          echo "No signing secrets found. Generating temporary development keystore and key.properties..."
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release-key -storepass password123 -keypass password123 -dname "CN=AI Assistant, OU=Development, O=AI Studio, L=CA, S=California, C=US"
          echo "storeFile=release.jks" > key.properties
          echo "storePassword=password123" >> key.properties
          echo "keyAlias=release-key" >> key.properties
          echo "keyPassword=password123" >> key.properties
          
          # Copy to android/ subfolder in case the build triggers there
          mkdir -p android
          cp release.jks android/
          cp key.properties android/
        fi

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
